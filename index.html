<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiChat Launcher</title>
</head>
<body>
    <p>Launch multichat</p>
    <select id="server-select">
        <option value="virginia">Virginia</option>
        <option value="oregon">Oregon</option>
        <option value="frankfurt">Frankfurt</option>
        <option value="ohio">Ohio</option>
        <option value="singapore">Singapore</option>
    </select>
    <p>--- OR ---</p>
    <input type="text" id="custom-server" placeholder="Enter custom server URL">
    <button id="launch-button">Launch</button>
    <script>
        launchURLs = {
            "virginia": "https://getmultichat.github.io/?s=v",
            "oregon": "https://getmultichat.github.io/?s=o",
            "frankfurt": "https://getmultichat.github.io/?s=f",
            "ohio": "https://getmultichat.github.io/?s=oh",
            "singapore": "https://getmultichat.github.io/?s=s"
        };

        small2full = {
            "v": "virginia",
            "o": "oregon",
            "f": "frankfurt",
            "oh": "ohio",
            "s": "singapore"
        };
    
        document.getElementById("launch-button").onclick = function() {
            if (document.getElementById("custom-server").value) {
                var customURL = document.getElementById("custom-server").value;
                window.location.href = "https://simplechat-gd38.onrender.com/?c=" + encodeURIComponent(customURL);
                return;
            }
            var select = document.getElementById("server-select");
            var server = select.value;
            var url = launchURLs[server];
            window.location.href = url;
        };

        params = new URLSearchParams(window.location.search);
        if (params.has('s')) {
            var server = params.get('s');
            if (server === "v") server = "virginia";
            else if (server === "o") server = "oregon";
            else if (server === "f") server = "frankfurt";
            else if (server === "oh") server = "ohio";
            else if (server === "s") server = "singapore";
            realServer = small2full[server] || server;

            window.location.href = "https://simplechat-gd38.onrender.com/?s=" + realServer;
        }
    </script>
</body>
</html>
